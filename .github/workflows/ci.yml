name: CI

# Runs on every push to main and on every pull request into main, so a
# broken build is caught before it gets merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Keep this in step with <TargetFramework> in LeaveManagement.Web.csproj.
      # net8.0 means 8.0.x, net9.0 means 9.0.x, and so on.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore LeaveManagement.Web/LeaveManagement.Web.csproj

      - name: Build
        run: dotnet build LeaveManagement.Web/LeaveManagement.Web.csproj --configuration Release --no-restore